# Local development services. Versions are pinned to minor tags.
# QUAD_IMAGE_REGISTRY is an optional registry host prefix with a trailing slash (for example a mirror).
name: quad

services:
  postgres:
    image: ${QUAD_IMAGE_REGISTRY:-}library/postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quad
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d quad']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: ${QUAD_IMAGE_REGISTRY:-}library/redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: ${QUAD_IMAGE_REGISTRY:-}minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quadminio
      MINIO_ROOT_PASSWORD: quadminio123
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: ${QUAD_IMAGE_REGISTRY:-}minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 quadminio quadminio123 &&
        mc mb --ignore-existing local/quad-private &&
        mc mb --ignore-existing local/quad-public

  mailpit:
    image: ${QUAD_IMAGE_REGISTRY:-}axllent/mailpit:v1.20
    ports:
      - '1025:1025'
      - '8025:8025'

  clamav:
    image: ${QUAD_IMAGE_REGISTRY:-}clamav/clamav:1.4
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav

volumes:
  postgres-data:
  minio-data:
  clamav-data:
