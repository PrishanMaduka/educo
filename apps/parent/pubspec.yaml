name: quad_parent
description: Quad parent app, one app for every school.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: 3.47.6

dependencies:
  dio: 5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  flutter_secure_storage: 11.2.0
  flutter_svg: 2.3.0
  go_router: 18.0.2
  intl: 0.20.3
  local_auth: 3.0.2
  quad_api:
    path: packages/quad_api
  riverpod_annotation: 4.0.7
  sentry_flutter: 9.30.1
  shared_preferences: 2.5.5

dev_dependencies:
  # analyzer 14.5 removed a setter build_runner 2.16.1 still uses; drop with the next build_runner.
  analyzer: 14.4.0
  build_runner: 2.16.1
  flutter_test:
    sdk: flutter
  # The nightly device journeys (integration_test/, spec 17).
  integration_test:
    sdk: flutter
  local_auth_platform_interface: 1.1.0
  riverpod_generator: 4.0.9
  very_good_analysis: 11.0.0

flutter:
  # `flutter run` without --flavor builds dev (bundle id com.quadedu.parent.dev).
  default-flavor: dev
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/greeting/
    - assets/icons/
    - assets/fonts/OFL-BricolageGrotesque.txt
    - assets/fonts/OFL-Figtree.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    # Static instances of Google Fonts' variable Bricolage Grotesque (opsz 24, wdth 100), made with
    # fontTools' instancer: Flutter picks a file by weight. The web loads the variable file.
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque-Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque-ExtraBold.ttf
          weight: 800
