include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated code: riverpod_generator parts, gen-l10n output, tokens and the API client
    # (packages/quad_api has its own analysis options and is checked by `dart analyze` there).
    - "**/*.g.dart"
    - lib/l10n/app_localizations*.dart
    - packages/**
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    # An app, not a published library: widget names say enough.
    public_member_api_docs: false
