name: quad_api
version: 1.0.0
description: Generated Quad API client
homepage: homepage
publish_to: none

# Overrides the dart-dio pubspec template (openapitools.json → templateDir) so the
# build_runner step in scripts/api-client.mjs resolves the same tools every time.
environment:
  # json_serializable 6.14 writes null-aware map elements (Dart 3.8).
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  dio: ^5.11.1
  json_annotation: ^4.12.0

dev_dependencies:
  # analyzer 14.5 removed a setter build_runner 2.16.1 still uses.
  analyzer: 14.4.0
  build_runner: 2.16.1
  json_serializable: 6.14.1
  test: 1.32.0
