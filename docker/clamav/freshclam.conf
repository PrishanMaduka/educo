# Signature updates for clamd (spec 20). Runs as the clamav user, which owns /var/lib/clamav, so
# there is no `DatabaseOwner` here.
# No UpdateLogFile: the startup script runs freshclam with --stdout, so updates are logged there.
DatabaseMirror database.clamav.net
ScriptedUpdates yes
NotifyClamd /etc/clamav/clamd.conf
# Twelve checks a day (every two hours).
Checks 12
