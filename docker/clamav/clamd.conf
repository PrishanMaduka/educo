# clamd for Quad's upload scanning (spec 20). The API streams files with INSTREAM over TCP.
# Runs as the clamav user (USER in the Dockerfile), so there is no `User` here.
# No LogFile: clamd refuses /dev/stdout (a symlink), so it only writes to the container's output.
LogTime yes
# The startup script waits for this socket before it reports clamd as started.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# Uploads are at most 100 MB; larger streams are refused rather than scanned in part.
StreamMaxLength 100M
MaxFileSize 100M
