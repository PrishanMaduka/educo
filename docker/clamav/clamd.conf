# clamd for Quad's upload scanning (spec 20). The API streams files with INSTREAM over TCP.
LogFile /var/log/clamav/clamd.log
LogTime yes
# The official health check (clamdcheck.sh) talks to the local socket.
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
# Uploads are at most 100 MB; larger streams are refused rather than scanned in part.
StreamMaxLength 100M
MaxFileSize 100M
User clamav
