<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quad Platform Console</title>
<link rel="icon" href="brand/quad-app-icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>

/* Layout: Classe365-style shell. Fixed navy module rail on the left, white top bar, cool-grey canvas with card grid. */
:root{
  --canvas:#F2F5FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#E3E8F0; --line-strong:#CBD3E0;
  --ink:#16213A; --ink-2:#4A5672; --ink-3:#7C879F;
  --brand:#2F6FED; --brand-ink:#FFFFFF; --brand-soft:#E8F0FE; --brand-strong:#1F55C7;
  --rail:#14203A; --rail-2:#1C2B4B; --rail-ink:#C5CFE3; --rail-ink-2:#8392B3; --rail-active:#2F6FED;
  --good:#138A5B; --good-soft:#E3F5EC; --warn:#B26A00; --warn-soft:#FFF2DC; --bad:#C83A2E; --bad-soft:#FDE8E5; --info:#5B4BC4; --info-soft:#EEEBFC;
  --c1:#2F6FED; --c2:#12A594; --c3:#E8A33D; --c4:#8B5CF6;
  --shadow:0 1px 2px rgba(20,32,58,.06),0 4px 16px rgba(20,32,58,.05);
  --shadow-lg:0 12px 40px rgba(20,32,58,.18);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; --r-sm:7px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --canvas:#0E1525; --surface:#151E31; --surface-2:#1A2439; --line:#26324B; --line-strong:#34425F;
  --ink:#E7ECF6; --ink-2:#AEB8CE; --ink-3:#7D89A3;
  --brand:#5B8CFF; --brand-ink:#0B1222; --brand-soft:#1C2C52; --brand-strong:#8AACFF;
  --rail:#0A1020; --rail-2:#131C31; --rail-ink:#C5CFE3; --rail-ink-2:#7584A6; --rail-active:#5B8CFF;
  --good:#4CC992; --good-soft:#123326; --warn:#F0B357; --warn-soft:#3A2A10; --bad:#FF7A6B; --bad-soft:#3D1A17; --info:#A99BFF; --info-soft:#262046;
  --c1:#4F86F7; --c2:#1BA898; --c3:#B57A26; --c4:#9575F0;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --canvas:#0E1525; --surface:#151E31; --surface-2:#1A2439; --line:#26324B; --line-strong:#34425F;
  --ink:#E7ECF6; --ink-2:#AEB8CE; --ink-3:#7D89A3;
  --brand:#5B8CFF; --brand-ink:#0B1222; --brand-soft:#1C2C52; --brand-strong:#8AACFF;
  --rail:#0A1020; --rail-2:#131C31; --rail-ink:#C5CFE3; --rail-ink-2:#7584A6; --rail-active:#5B8CFF;
  --good:#4CC992; --good-soft:#123326; --warn:#F0B357; --warn-soft:#3A2A10; --bad:#FF7A6B; --bad-soft:#3D1A17; --info:#A99BFF; --info-soft:#262046;
  --c1:#4F86F7; --c2:#1BA898; --c3:#B57A26; --c4:#9575F0;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 40px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;line-height:1.2}
h2{font-size:16px}
h3{font-size:14px;font-family:var(--f-body);font-weight:700}
.muted{color:var(--ink-3)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

/* Shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%;transition:grid-template-columns .2s}
.app.collapsed{grid-template-columns:72px 1fr}
.rail{background:var(--rail);color:var(--rail-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;min-height:64px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2F6FED,#12A594);display:grid;place-items:center;flex:none;color:#fff;font:700 17px var(--f-display)}
.brand b{font:700 18px var(--f-display);color:#fff;white-space:nowrap}
.brand small{display:block;font-size:11px;color:var(--rail-ink-2);white-space:nowrap}
.nav{flex:1;overflow-y:auto;padding:6px 10px 16px;scrollbar-width:thin}
.nav-group{margin-top:14px}
.nav-label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-ink-2);padding:0 10px 6px;white-space:nowrap}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:8px;color:var(--rail-ink);font-weight:500;white-space:nowrap;position:relative}
.nav a:hover{background:var(--rail-2);color:#fff}
.nav a.on{background:var(--rail-active);color:#fff}
.nav a svg{flex:none;opacity:.9}
.nav .count{margin-left:auto;font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:20px}
.nav a.on .count{background:rgba(255,255,255,.25)}
.app.collapsed .nav-label,.app.collapsed .nav a span,.app.collapsed .nav .count,.app.collapsed .brand div,.app.collapsed .rail-foot div{display:none}
.app.collapsed .nav a{justify-content:center}
.rail-foot{border-top:1px solid var(--rail-2);padding:12px 14px;display:flex;align-items:center;gap:10px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:64px}
.iconbtn{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2);position:relative;flex:none}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.dot{position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.search{flex:1;min-width:0;max-width:460px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:0 12px;height:38px;color:var(--ink-3);cursor:text}
.search span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:600 11px var(--f-body);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--ink-3);background:var(--surface)}
.top .spacer{flex:1}
.yearpick{border:1px solid var(--line);background:var(--surface);border-radius:9px;height:38px;padding:0 10px;font-weight:600;color:var(--ink-2)}
.me{display:flex;align-items:center;gap:10px;padding-left:6px}
.me b{display:block;font-size:13px;line-height:1.2}.me small{color:var(--ink-3);font-size:11.5px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:#fff}
.av.sm{width:28px;height:28px;font-size:11px}.av.lg{width:72px;height:72px;font-size:24px}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1480px;width:100%}
.menu-btn{display:none}

/* Generic */
.page-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .grow{flex:1;min-width:220px}
.crumbs{font-size:12px;color:var(--ink-3);margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.danger{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h2{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:20px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g-2-1{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-1-1{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .v{font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .l{font-size:12.5px;color:var(--ink-3);font-weight:600}
.kpi .d{font-size:12px;margin-top:4px;color:var(--ink-3)}
.up{color:var(--good);font-weight:700}.down{color:var(--bad);font-weight:700}
.t-blue{background:var(--brand-soft);color:var(--brand)}.t-green{background:var(--good-soft);color:var(--good)}.t-amber{background:var(--warn-soft);color:var(--warn)}.t-violet{background:var(--info-soft);color:var(--info)}.t-red{background:var(--bad-soft);color:var(--bad)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:20px;padding:4px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .n{opacity:.6;margin-left:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.input,select.input,textarea.input{height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 11px;min-width:0;width:100%}
textarea.input{height:auto;padding:9px 11px;resize:vertical}
.input:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
.input.inline{width:auto}
.input.err{border-color:var(--bad)}
.err-msg{color:var(--bad);font-size:12px}
.searchbox{position:relative;flex:1;min-width:180px;max-width:320px}
.searchbox svg{position:absolute;left:10px;top:10px;color:var(--ink-3)}
.searchbox .input{padding-left:34px}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
.who{display:flex;align-items:center;gap:10px}
.who b{display:block;font-weight:600;line-height:1.25}.who small{color:var(--ink-3);font-size:12px}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--brand)}
.tbl-foot{display:flex;align-items:center;gap:10px;padding:10px 18px;color:var(--ink-3);font-size:12.5px}
.tbl-foot .grow{flex:1}

/* Charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--ink-3);font:11px var(--f-body)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;z-index:100;background:var(--ink);color:var(--surface);font-size:12px;padding:7px 10px;border-radius:7px;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .1s;max-width:240px;line-height:1.4}
#tip.on{opacity:1}

/* Feed, lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:flex-start}
.li:last-child{border-bottom:0}
.li .meta{flex:1;min-width:0}
.li .meta b{font-weight:600}
.li .meta p{margin:2px 0 0;color:var(--ink-3);font-size:12.5px}
.li time{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.dot-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.task{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}
.task input{width:17px;height:17px;accent-color:var(--brand)}
.task.done span{text-decoration:line-through;color:var(--ink-3)}
.task small{margin-left:auto;color:var(--ink-3);font-size:12px}

/* Kanban */
.kanban{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:420px}
.col-h{display:flex;align-items:center;gap:8px;padding:12px 14px;font-weight:700}
.col-h i{width:8px;height:8px;border-radius:50%}
.col-h .n{margin-left:auto;font-size:12px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:0 8px}
.col-b{flex:1;display:flex;flex-direction:column;gap:10px;padding:0 10px 12px}
.col.drop{outline:2px dashed var(--brand);outline-offset:-4px;background:var(--brand-soft)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px;cursor:grab;box-shadow:var(--shadow)}
.kcard:hover{border-color:var(--brand)}
.kcard.dragging{opacity:.4}
.kcard b{display:block}
.kcard .row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-3)}
.kcard .row .grow{flex:1}
.prio{width:6px;height:6px;border-radius:50%;display:inline-block}

/* Drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,32,.45);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:70;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.drawer.on{transform:none}
.drawer-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer-h h2{flex:1}
.drawer-b{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%) scale(.98);width:min(640px,calc(100% - 32px));max-height:calc(100% - 48px);background:var(--surface);border-radius:14px;z-index:80;opacity:0;pointer-events:none;transition:.18s;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .drawer-b{gap:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.steps{display:flex;gap:6px;padding:14px 20px 0}
.steps div{flex:1;font-size:12px;font-weight:700;color:var(--ink-3)}
.steps div::before{content:"";display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:6px}
.steps div.on{color:var(--brand)}.steps div.on::before{background:var(--brand)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0;font-weight:600;min-width:0}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.timeline div{position:relative;padding:0 0 14px 18px;font-size:13px}
.timeline div::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.timeline small{display:block;color:var(--ink-3)}
.checkrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.checkrow:last-child{border:0}

/* Command palette */
.cmdk{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(600px,calc(100% - 32px));background:var(--surface);border-radius:14px;z-index:90;box-shadow:var(--shadow-lg);display:none;overflow:hidden;border:1px solid var(--line)}
.cmdk.on{display:block}
.cmdk input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:16px;background:transparent;outline:0}
.cmdk ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.cmdk li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:8px;cursor:pointer}
.cmdk li small{margin-left:auto;color:var(--ink-3)}
.cmdk li.on{background:var(--brand-soft);color:var(--brand)}

/* Notifications panel */
.notif{position:fixed;top:64px;right:16px;width:min(380px,calc(100% - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);z-index:50;display:none}
.notif.on{display:block}

/* Toast */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:120;align-items:center}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}

/* SIS */
.profile-head{display:flex;gap:20px;align-items:center;padding:20px;flex-wrap:wrap}
.profile-head .info{flex:1;min-width:220px}
.profile-head .facts{display:flex;gap:24px;flex-wrap:wrap}
.profile-head .facts div{font-size:12px;color:var(--ink-3)}.profile-head .facts b{display:block;font-size:15px;color:var(--ink)}
.heat{display:grid;grid-template-columns:repeat(auto-fill,minmax(22px,1fr));gap:4px}
.heat span{aspect-ratio:1;border-radius:4px;background:var(--line);max-width:100%}
.heat .P{background:var(--good);opacity:.85}.heat .A{background:var(--bad)}.heat .L{background:var(--warn)}.heat .E{background:var(--info)}.heat .H{background:transparent;border:1px dashed var(--line-strong)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-weight:700;font-size:12px;color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on.P{background:var(--good);color:#fff}.seg button.on.A{background:var(--bad);color:#fff}.seg button.on.L{background:var(--warn);color:#fff}.seg button.on.E{background:var(--info);color:#fff}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:16px 18px}
.scard{border:1px solid var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;background:var(--surface)}
.scard:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.scard .av{margin:0 auto 10px;width:56px;height:56px;font-size:18px}

/* LMS */
.course{overflow:hidden;cursor:pointer}
.course .cover{height:84px;padding:14px 16px;color:#fff;display:flex;flex-direction:column;justify-content:space-between}
.course .cover small{opacity:.85;font-weight:600;font-size:11.5px}
.course .cover b{font:700 17px var(--f-display)}
.course .cb{padding:14px 16px;display:flex;flex-direction:column;gap:10px;font-size:12.5px;color:var(--ink-3)}
.tt{display:grid;grid-template-columns:70px repeat(5,minmax(120px,1fr));gap:6px;min-width:760px}
.tt .h{font-weight:700;font-size:12px;color:var(--ink-3);padding:6px;text-align:center}
.tt .t{font-size:11.5px;color:var(--ink-3);padding:8px 4px;text-align:right}
.tt .s{border-radius:8px;padding:8px 10px;font-size:12px;min-height:56px;border-left:3px solid}
.tt .s b{display:block;font-size:12.5px}
.tt .brk{grid-column:2/-1;text-align:center;font-size:11.5px;color:var(--ink-3);background:var(--surface-2);border-radius:8px;padding:6px;letter-spacing:.08em;text-transform:uppercase}
.gb input{width:56px;height:30px;border:1px solid transparent;border-radius:6px;text-align:center;background:transparent;font-variant-numeric:tabular-nums}
.gb input:hover{border-color:var(--line-strong)}
.gb input:focus{border-color:var(--brand);background:var(--surface);outline:0}
.gb td{padding:6px 10px}

/* Fees invoice preview */
.inv{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--surface-2)}
.inv table td{padding:8px 0;border-color:var(--line)}
.inv .tot td{font-weight:700;border:0;padding-top:12px}

/* Finance */
.coa div{display:flex;align-items:center;gap:10px;padding:9px 18px;border-bottom:1px solid var(--line);font-size:13px}
.coa .l1{font-weight:700;background:var(--surface-2)}
.coa .l2{padding-left:38px}
.coa .l3{padding-left:62px;color:var(--ink-2)}
.coa code{font-size:12px;color:var(--ink-3);width:54px}
.coa .amt{margin-left:auto;font-variant-numeric:tabular-nums}

/* Inbox */
.inbox{display:grid;grid-template-columns:320px 1fr;min-height:520px}
.inbox .threads{border-right:1px solid var(--line);overflow-y:auto}
.thread{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
.thread.on{background:var(--brand-soft)}
.thread .meta{flex:1;min-width:0}
.thread p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv{display:flex;flex-direction:column}
.msgs{flex:1;padding:18px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;max-height:420px}
.msg{max-width:72%;padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:13px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.msg small{display:block;opacity:.7;font-size:11px;margin-top:4px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

@media (max-width:1100px){.g-2-1,.g-3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:264px;transform:translateX(-100%);transition:transform .25s}
  .app.mobile-open .rail{transform:none}
  .app.collapsed .nav-label,.app.collapsed .nav a span,.app.collapsed .nav .count,.app.collapsed .brand div,.app.collapsed .rail-foot div{display:revert}
  .menu-btn{display:grid}
  .collapse-btn,.me div,.yearpick,.search kbd{display:none}
  .top{padding:10px 16px}
  .content{padding:16px}
  .g-1-1{grid-template-columns:1fr}
  .inbox{grid-template-columns:1fr}
  .inbox .threads{max-height:240px;border-right:0;border-bottom:1px solid var(--line)}
  .form-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:110px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Platform console: same system as the school admin, with a darker rail and a teal accent so operators always know they're above the tenants. */
:root{--rail:#0B1222;--rail-2:#16213A;--rail-active:#12A594;--op:#12A594;--op-soft:#E0F5F2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rail:#060A14;--rail-2:#111A2E;--rail-active:#1BA898;--op:#2EC4B0;--op-soft:#0F2E2B}}
:root[data-theme="dark"]{--rail:#060A14;--rail-2:#111A2E;--rail-active:#1BA898;--op:#2EC4B0;--op-soft:#0F2E2B}
.btn{justify-content:center}

.nav a span{overflow:hidden;text-overflow:ellipsis}
.bulkbar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:var(--brand-soft);border-bottom:1px solid var(--line);flex-wrap:wrap}

.perm-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:420px}

.perm td,.perm th{text-align:center}

.savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--ink);color:var(--surface);border-radius:0 0 var(--r) var(--r);animation:tin .2s}

.savebar .btn{border-color:transparent}
.switch{width:42px;height:24px;border-radius:12px;background:var(--line-strong);position:relative;border:0;flex:none;transition:background .2s}

.switch.on{background:var(--good)}

.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.mod{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--surface)}
.mod .meta{flex:1;min-width:0}

.mod .meta small{color:var(--ink-3);font-size:12.5px}

.preview{display:grid;grid-template-columns:1.3fr .8fr;gap:16px;align-items:start}
.mini-admin{border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;grid-template-columns:120px 1fr;height:230px;background:var(--canvas)}
.mini-admin .r{padding:12px 10px;display:flex;flex-direction:column;gap:7px;color:#fff;font-size:11px}

.mini-admin .m b{background:var(--surface);border:1px solid var(--line);border-radius:7px}
.mini-admin .m b.wide{grid-column:1/-1}
.mini-phone{width:150px;height:260px;border-radius:24px;background:#0B0F1A;padding:7px;justify-self:center}

.mini-phone .h{height:62px;border-radius:12px}
.mini-phone s{display:block;height:22px;border-radius:7px;background:var(--surface);border:1px solid var(--line)}
.mini-phone .tb{margin-top:auto;display:flex;justify-content:space-around;padding-top:6px;border-top:1px solid var(--line)}

.prov{display:flex;flex-direction:column;gap:12px}

.addon{display:flex;align-items:center;gap:0}

.addon span{height:36px;display:grid;place-items:center;padding:0 12px;border:1px solid var(--line-strong);border-left:0;border-radius:0 8px 8px 0;background:var(--surface-2);color:var(--ink-3);font-size:13px;white-space:nowrap}

.plan{padding:20px;display:flex;flex-direction:column;gap:12px}

.plan ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:13px}

.plan.feat{border:2px solid var(--brand)}
.status-row{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);font-size:13.5px}
.status-row:last-child{border-bottom:0}
.status-row span{flex:1}
.status-row small{color:var(--ink-3)}
.code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
@media (max-width:900px){.sys-pill{display:none}.search{min-width:0}.perm-wrap{grid-template-columns:minmax(0,1fr)}.role-list{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto}.role-list button{border-bottom:0;border-right:1px solid var(--line);min-width:170px}.preview{grid-template-columns:1fr}}

.uk-res button:hover{background:var(--surface-2)}
.uk-res b{display:block;font-weight:600;font-size:13px}.uk-res small{color:var(--ink-3);font-size:12px}
.perm td,.perm th{text-align:center}.perm td:first-child,.perm th:first-child{text-align:left}

/* ================= Console theme: "Night" by default, "Day" on request =================
   Layout: floating glass rail on a deep ink canvas lit by two soft glows; serif display type for titles and figures. */
:root:not([data-theme="light"]){
  --canvas:#060A14; --surface:#0D1322; --surface-2:#111A2D; --line:#1B2438; --line-strong:#2A3550;
  --ink:#EEF2FA; --ink-2:#A9B4CC; --ink-3:#6E7A95;
  --brand:#6E9BFF; --brand-ink:#06101F; --brand-soft:#15213F; --brand-strong:#9DBBFF;
  --good:#46D49B; --good-soft:#0F2A22; --warn:#F2B661; --warn-soft:#2E2312; --bad:#FF7B6E; --bad-soft:#331815; --info:#B3A4FF; --info-soft:#221C42;
  --c1:#4F86F7; --c2:#1BA898; --c3:#B57A26; --c4:#9575F0;
  --glass:rgba(255,255,255,.035); --glass-2:rgba(255,255,255,.06); --hair:rgba(255,255,255,.07);
  --glow-a:rgba(27,168,152,.20); --glow-b:rgba(79,134,247,.18);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.6); --shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --canvas:#F3F5FA; --surface:#FFFFFF; --surface-2:#F7F9FC; --line:#E5E9F1; --line-strong:#CDD4E1;
  --ink:#0E1526; --ink-2:#465169; --ink-3:#7A859C;
  --brand:#2F6FED; --brand-ink:#FFFFFF; --brand-soft:#E9F0FE; --brand-strong:#1F55C7;
  --good:#138A5B; --good-soft:#E3F5EC; --warn:#B26A00; --warn-soft:#FFF2DC; --bad:#C83A2E; --bad-soft:#FDE8E5; --info:#5B4BC4; --info-soft:#EEEBFC;
  --c1:#2F6FED; --c2:#12A594; --c3:#E8A33D; --c4:#8B5CF6;
  --glass:rgba(255,255,255,.72); --glass-2:#FFFFFF; --hair:rgba(14,21,38,.07);
  --glow-a:rgba(18,165,148,.10); --glow-b:rgba(47,111,237,.10);
  --shadow:0 1px 2px rgba(14,21,38,.04),0 12px 32px -16px rgba(14,21,38,.14); --shadow-lg:0 30px 70px -20px rgba(14,21,38,.3);
  color-scheme:light;
}
:root{--f-head:"Sora","Plus Jakarta Sans",system-ui,sans-serif;--grad:linear-gradient(135deg,#2EC4B0 0%,#4F86F7 100%)}
body{background:radial-gradient(900px 500px at 12% -10%,var(--glow-a),transparent 60%),radial-gradient(800px 500px at 95% 0%,var(--glow-b),transparent 60%),var(--canvas);background-attachment:fixed}

/* Rail */
.app{grid-template-columns:284px 1fr}
.rail{margin:12px 0 12px 12px;height:calc(100vh - 24px);top:12px;border-radius:22px;background:linear-gradient(180deg,#0C1426 0%,#070C18 100%);border:1px solid rgba(255,255,255,.06);box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.brand{padding:20px 20px 16px}
.brand b{font:600 20px/1 var(--f-head);letter-spacing:-.02em}
.op-badge{background:none;border:1px solid rgba(46,196,176,.5);color:#5EE0CC;font-size:9px;padding:2px 6px;letter-spacing:.14em}
.nav-label{font-size:10px;letter-spacing:.16em;color:#5B6783}
.nav a{border-radius:12px;padding:10px 12px;color:#B9C3D9;font-size:13.5px}
.nav a:hover{background:rgba(255,255,255,.04);color:#fff}
.nav a.on{background:linear-gradient(135deg,rgba(46,196,176,.18),rgba(79,134,247,.18));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.nav a.on svg{color:#5EE0CC}
.nav .count{background:rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.rail-foot{border-top:1px solid rgba(255,255,255,.06);margin:0 10px;padding:14px 8px}

/* Top bar */
.top{background:color-mix(in srgb,var(--canvas) 72%,transparent);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border-bottom:1px solid var(--hair);padding:12px 32px}
.iconbtn,.search,.yearpick{background:var(--glass);border-color:var(--hair);border-radius:12px}
.search{max-width:520px;border-radius:999px;padding:0 16px}
kbd{background:transparent;border-color:var(--line-strong)}
.sys-pill{background:transparent!important;border:1px solid color-mix(in srgb,var(--good) 40%,transparent);color:var(--good)!important;padding:0 12px}
.sys-pill::before{animation:sysPulse 2s infinite}
@keyframes sysPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--good) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}

/* Content & type */
.content{padding:32px 36px 48px;gap:24px;max-width:1520px}
h1{font:600 42px/1.08 var(--f-head);letter-spacing:-.035em}
.page-head h1{font-size:40px}
.crumbs,.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
h2{font:600 15px/1.3 var(--f-body);letter-spacing:0}
.muted{color:var(--ink-3)}

/* Surfaces */
.card{background:linear-gradient(180deg,var(--glass-2),var(--glass));border:1px solid var(--hair);border-radius:20px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.card-h{border-bottom:1px solid var(--hair);padding:18px 22px}
.card-b{padding:20px 22px}
.drawer,.modal,.cmdk,.uk-res,.notif{background:var(--surface);border:1px solid var(--hair)}
.modal{border-radius:22px}
.scrim{background:rgba(3,6,14,.6);backdrop-filter:blur(4px)}

/* Controls */
.btn{border-radius:12px;height:38px;padding:0 16px;background:var(--glass);border-color:var(--hair);color:var(--ink);transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{background:var(--glass-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 24px -10px rgba(79,134,247,.8)}
.btn.primary:hover{background:var(--grad);box-shadow:0 14px 30px -10px rgba(46,196,176,.8);transform:translateY(-1px)}
.btn.sm{height:32px;border-radius:10px}
.btn.ghost{background:transparent;border-color:transparent}
.input,select.input,textarea.input{background:var(--surface-2);border-color:var(--line);border-radius:10px}
.chip{background:transparent;border-color:var(--line-strong);color:var(--ink-2);border-radius:999px}
.chip.on{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.pill{font-weight:600;letter-spacing:.01em;padding:3px 10px;background:transparent!important;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.tabs{border-bottom:1px solid var(--hair);gap:6px;padding:0 10px}
.tabs button{padding:14px 12px;font-weight:600}
.tabs button.on{color:var(--ink);border-color:transparent;position:relative}
.tabs button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--grad)}
.toolbar{border-bottom:1px solid var(--hair);padding:14px 22px}
th{background:transparent;color:var(--ink-3);font-size:10.5px;letter-spacing:.14em;border-bottom:1px solid var(--hair);padding:12px 18px}
td{border-bottom:1px solid var(--hair);padding:14px 18px}
tr.click:hover td{background:color-mix(in srgb,var(--brand) 6%,transparent)}
.bar{background:color-mix(in srgb,var(--ink) 9%,transparent);height:5px}
.bar i{background:var(--grad)!important}
.code{background:transparent;border-color:var(--hair);color:var(--ink-3)}
.tenant-logo{border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.li{border-bottom:1px solid var(--hair);padding:14px 22px}
.dot-ic{border-radius:10px}
.inv{background:var(--surface-2);border-color:var(--hair);border-radius:14px}
.status-row{border-bottom:1px solid var(--hair);padding:12px 22px}
.setting,.uk-set{border-bottom:1px solid var(--hair)}
.savebar,.uk-bar{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:var(--shadow-lg)}
.toast{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-radius:14px}
#tip{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}

/* KPI tiles */
.kpi{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:20px 22px 0;overflow:hidden;position:relative}
.kpi .kl{display:flex;align-items:center;justify-content:space-between;color:var(--ink-3);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.kpi .kl svg{opacity:.6}
.kpi .v{font:600 34px/1.05 var(--f-head);letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12.5px;color:var(--ink-3);padding-bottom:18px}
.kpi .spark{display:block;margin:0 -22px;width:calc(100% + 44px);height:46px}
.kpi.has-spark .d{padding-bottom:6px}

/* Overview hero */
.hero{display:flex;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:8px 0 4px}
.hero .grow{flex:1;min-width:280px}
.hero h1{font-size:clamp(40px,5vw,64px);line-height:1}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.08em}
.hero p{margin:14px 0 0;color:var(--ink-2);font-size:16px;max-width:62ch}
.hero p b{color:var(--ink);font-weight:600}
.range{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:3px;gap:2px}
.range button{border:0;background:none;color:var(--ink-3);font-weight:600;font-size:12px;padding:5px 12px;border-radius:999px}
.range button.on{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}
.big-fig{font:600 34px/1 var(--f-head)}
.chart .grid-l{stroke:var(--hair)}
.draw{stroke-dasharray:var(--len,2000);stroke-dashoffset:var(--len,2000);animation:draw 1.4s cubic-bezier(.3,.7,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fade-in{opacity:0;animation:fadeIn .9s ease .5s forwards}
@keyframes fadeIn{to{opacity:1}}
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{flex:none}
.legend-list{display:flex;flex-direction:column;gap:12px;flex:1;min-width:150px}
.legend-list div{display:flex;align-items:center;gap:10px;font-size:13px}
.legend-list i{width:10px;height:10px;border-radius:3px;flex:none}
.legend-list span{flex:1}
.legend-list b{font-variant-numeric:tabular-nums}
.country{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--hair);font-size:13.5px}
.country:last-child{border-bottom:0}
.country .bar{grid-column:1/-1}
.sev{width:8px;height:8px;border-radius:50%;flex:none;margin-top:6px}

/* Reveal on route change */
.content>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.content>*:nth-child(2){animation-delay:.05s}.content>*:nth-child(3){animation-delay:.1s}.content>*:nth-child(4){animation-delay:.15s}.content>*:nth-child(5){animation-delay:.2s}.content>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* School gallery */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;padding:22px}
.tcard{border:1px solid var(--hair);border-radius:18px;overflow:hidden;background:var(--surface-2);cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;display:flex;flex-direction:column}
.tcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--tc) 50%,transparent)}
.tcard:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.tcard .cv{height:78px;background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--tc) 85%,#fff 0%),transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--tc) 70%,#000),color-mix(in srgb,var(--tc) 35%,#060A14));position:relative}
.tcard .cv .pill{position:absolute;right:12px;top:12px;color:#fff;border-color:rgba(255,255,255,.35)}
.tcard .tb{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px;margin-top:-22px;position:relative}
.tcard .tenant-logo{width:46px;height:46px;border-radius:14px;border:3px solid var(--surface-2);box-sizing:content-box}
.tcard h3{font:600 18px/1.25 var(--f-head);margin:0;letter-spacing:-.02em}
.tcard .row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink-3);gap:8px}
.tcard .row b{color:var(--ink);font-variant-numeric:tabular-nums}
.viewtog{display:inline-flex;border:1px solid var(--hair);border-radius:12px;padding:3px;gap:2px}
.viewtog button{border:0;background:none;color:var(--ink-3);padding:6px 9px;border-radius:9px;display:grid;place-items:center}
.viewtog button.on{background:var(--glass-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hair)}

/* Tenant cover */
.t-cover{height:120px;border-radius:20px 20px 0 0;background:radial-gradient(70% 160% at 0% 0%,color-mix(in srgb,var(--tc) 90%,#fff 0%),transparent 70%),radial-gradient(60% 120% at 100% 0%,rgba(79,134,247,.35),transparent 70%),linear-gradient(135deg,color-mix(in srgb,var(--tc) 60%,#000),#070C18);position:relative;overflow:hidden}
.t-cover::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 22px)}
.covered .profile-head{margin-top:-46px;position:relative;align-items:flex-end}
.covered .profile-head .tenant-logo.lg{width:84px;height:84px;border-radius:22px;font-size:28px;border:4px solid var(--surface);box-sizing:content-box}
.covered .profile-head h1{font-size:34px}
.covered .profile-head .info{padding-top:50px}

@media (max-width:900px){
  .rail{margin:0;height:100%;top:0;border-radius:0}
  .content{padding:20px 16px 40px}
  .top{padding:10px 16px}
  .hero h1{font-size:40px}
  .page-head h1{font-size:36px}
  .tgrid{padding:16px;grid-template-columns:1fr}
  .covered .profile-head .info{padding-top:0}
  .att-cta{display:none}
}

/* Sign-in screen */
[hidden]{display:none!important}
.auth{position:fixed;inset:0;z-index:300;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr);background:var(--surface);animation:authIn .35s ease}
.auth.leave{opacity:0;transform:scale(1.015);transition:opacity .45s,transform .45s}
@keyframes authIn{from{opacity:0}}
.auth-art{position:relative;overflow:hidden;color:#fff;padding:44px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:var(--auth-bg)}
.auth-art::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,transparent,#000 45%,transparent);mask-image:linear-gradient(180deg,transparent,#000 45%,transparent)}
.auth-art>*{position:relative;z-index:1}
.auth-brand{display:flex;gap:12px;align-items:center}
.auth-logo{width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;overflow:hidden;color:var(--brand);font:700 17px var(--f-display);box-shadow:0 10px 30px -10px rgba(0,0,0,.5);flex:none}
.auth-logo img{width:100%;height:100%;object-fit:contain;padding:5px}
.auth-logo.q{background:linear-gradient(135deg,#2F6FED,#12A594)}
.auth-logo.q svg{width:70%;height:70%}
.auth-brand b{display:block;font:700 18px var(--f-display)}.auth-brand small{opacity:.8;font-size:12.5px}
.auth-quote{max-width:560px}.auth-quote h2{font:700 clamp(28px,3.4vw,46px)/1.06 var(--f-display);margin:0 0 14px;letter-spacing:-.025em}.auth-quote p{opacity:.85;font-size:16px;margin:0}
.auth-stats{display:flex;gap:12px;flex-wrap:wrap}.auth-stats div{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:12px 16px;min-width:112px}.auth-stats b{display:block;font:700 22px var(--f-display)}.auth-stats span{font-size:12px;opacity:.85}
.auth-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;gap:22px;overflow-y:auto;background:var(--surface)}
.auth-card{width:min(400px,100%);display:flex;flex-direction:column;gap:14px;animation:authIn .3s ease}
.auth-card h1{font-size:30px;margin:0;letter-spacing:-.02em}.auth-card p{margin:0}
.auth-form{display:flex;flex-direction:column;gap:14px}
.lbl-row{display:flex;justify-content:space-between;align-items:center}
.btn.big{height:46px;font-size:14.5px;width:100%;justify-content:center}
.btn.sso{height:46px;width:100%;justify-content:center;gap:10px}
.auth-or{display:flex;align-items:center;gap:12px;color:var(--ink-3);font-size:12px}.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.pw{position:relative}.pw .input{padding-right:58px}.pw .linkbtn{position:absolute;right:12px;top:50%;transform:translateY(-50%)}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:600;font-size:12.5px;padding:0;cursor:pointer;align-self:flex-start}
.otp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp input{height:56px;text-align:center;font:700 22px var(--f-display);border:1.5px solid var(--line-strong);border-radius:12px;background:var(--surface-2);color:var(--ink);width:100%;min-width:0}
.otp input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.otp.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.auth-foot{font-size:12px;color:var(--ink-3);text-align:center}
.small{font-size:13px}
.auth-ok{width:60px;height:60px;border-radius:18px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.auth-spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--brand-soft);border-top-color:var(--brand);animation:authSpin .8s linear infinite}@keyframes authSpin{to{transform:rotate(360deg)}}
.rail-foot .so{margin-left:auto;width:32px;height:32px;background:transparent;border:1px solid rgba(255,255,255,.14);color:var(--rail-ink,#C5CFE3);border-radius:9px}
.rail-foot .so:hover{background:rgba(255,255,255,.08);color:#fff}
@media (max-width:860px){.auth{grid-template-columns:1fr;overflow-y:auto;grid-template-rows:auto 1fr}.auth-art{padding:24px}.auth-quote h2{font-size:26px}.auth-stats{display:none}.auth-panel{justify-content:flex-start;padding-top:28px}}
@media (prefers-reduced-motion:reduce){.auth,.auth-card{animation:none}}

:root{--auth-bg:radial-gradient(70% 60% at 0% 0%,rgba(46,196,176,.45),transparent 60%),radial-gradient(60% 60% at 100% 100%,rgba(79,134,247,.45),transparent 60%),#060A14}
.tenant-logo.has-img{background:#fff!important;padding:3px;overflow:hidden}
.tenant-logo img{width:100%;height:100%;object-fit:contain;display:block}
.modal.wide{width:min(900px,calc(100% - 32px))}
.wb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.wb-l{display:flex;flex-direction:column;gap:18px;min-width:0}
.drop{display:flex;align-items:center;gap:14px;padding:14px;border:1.5px dashed var(--line-strong);border-radius:14px;cursor:pointer;background:var(--surface-2);transition:border-color .2s,background .2s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop img{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff;padding:4px;flex:none}
.drop-ic{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);flex:none}
.drop b{display:block}.drop small{color:var(--ink-3);font-size:12px}
.bm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bm figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.bm figcaption{font-size:10.5px;color:var(--ink-3);text-align:center;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.bm-frame{height:150px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);box-shadow:var(--shadow)}
.bm-logo{width:24px;height:24px;border-radius:7px;background:#fff;display:grid;place-items:center;overflow:hidden;color:var(--sc);font:700 8px var(--f-body);flex:none}
.bm-logo img{width:100%;height:100%;object-fit:contain;padding:1px}
.bm-logo.lg{width:30px;height:30px;font-size:9px}
.bm-login{display:grid;grid-template-columns:1fr 1fr}
.bm-art{padding:10px;color:#fff;display:flex;flex-direction:column;gap:6px;background:radial-gradient(90% 70% at 0% 0%,color-mix(in srgb,var(--sc) 85%,#fff),transparent 60%),linear-gradient(160deg,color-mix(in srgb,var(--sc) 75%,#000),#0B1222)}
.bm-art b{font-size:8.5px;line-height:1.2}
.bm-art i,.bm-form s{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.4)}
.bm-art i.s{width:60%;margin-top:auto}
.bm-form{background:var(--surface);padding:12px 10px;display:flex;flex-direction:column;gap:7px;justify-content:center}
.bm-form b{font-size:9px}
.bm-form s{background:var(--line);height:9px}
.bm-form em{display:block;height:11px;border-radius:4px;background:var(--sc)}
.bm-admin{display:grid;grid-template-columns:40px 1fr}
.bm-rail{background:color-mix(in srgb,var(--sc) 18%,#0B1222);padding:8px 6px;display:flex;flex-direction:column;gap:6px;align-items:center}
.bm-rail i{width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.bm-rail i.on{background:var(--sc)}
.bm-main{padding:8px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:22px 1fr;gap:6px}
.bm-main span{background:var(--surface);border:1px solid var(--line);border-radius:5px}
.bm-main span.w{grid-column:1/-1;background:linear-gradient(to top,var(--sc) 0 45%,transparent 45%) 18% 100%/12% 75% no-repeat,linear-gradient(to top,var(--sc) 0 75%,transparent 75%) 48% 100%/12% 75% no-repeat,linear-gradient(to top,var(--sc) 0 60%,transparent 60%) 78% 100%/12% 75% no-repeat,var(--surface)}
.bm figure.bm-phone-wrap{grid-column:1/-1;display:flex;flex-direction:row;gap:14px;align-items:center;justify-content:center}
.bm-phone{width:86px;height:170px;border-radius:18px;border:4px solid #0B0F1A;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column;gap:6px;padding-bottom:6px}
.bm-hero{height:58px;padding:8px;background:linear-gradient(140deg,var(--sc),color-mix(in srgb,var(--sc) 55%,#000))}
.bm-phone s{display:block;height:12px;margin:0 6px;border-radius:4px;background:var(--surface);border:1px solid var(--line)}
.bm-tb{margin-top:auto;display:flex;justify-content:space-around;padding:4px 6px 0;border-top:1px solid var(--line)}
.bm-tb i{width:9px;height:9px;border-radius:3px;background:var(--line-strong)}.bm-tb i:first-child{background:var(--sc)}
.bm-lock{width:86px;height:170px;border-radius:18px;border:4px solid #0B0F1A;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-size:7.5px;font-weight:700;text-align:center;padding:6px;background:linear-gradient(160deg,color-mix(in srgb,var(--sc) 70%,#000),var(--sc) 70%,color-mix(in srgb,var(--sc) 60%,#12A594))}
@media (max-width:760px){.wb{grid-template-columns:1fr}}

/* Form drawers: every input form opens as a side panel, like the applicant panel */
.drawer.form{width:min(600px,100%)}
.drawer.form.wide{width:min(900px,100%)}
.drawer.form .drawer-h{padding:22px 22px 18px;background:linear-gradient(180deg,var(--brand-soft),transparent);align-items:flex-start;gap:14px;border-bottom:1px solid var(--line)}
.drawer.form .drawer-h h2{font:700 22px/1.2 var(--f-display);margin:2px 0;letter-spacing:-.01em}
.drawer.form .drawer-h .eyebrow{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.fd-ic{width:46px;height:46px;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 10px 22px -10px var(--brand)}
.drawer.form.danger .drawer-h{background:linear-gradient(180deg,var(--bad-soft),transparent)}
.drawer.form.danger .fd-ic{background:var(--bad);box-shadow:0 10px 22px -10px var(--bad)}
.drawer.form .steps{padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface);margin:0}
.drawer.form .drawer-b{background:var(--canvas);padding:20px 22px;gap:14px}
.fd-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow);min-width:0}
.drawer.form .drawer-f{background:var(--surface);padding:14px 22px;border-top:1px solid var(--line)}
.drawer.form .err-msg:empty{display:none}
@media (max-width:600px){.drawer.form .drawer-h{padding:18px 16px 14px}.drawer.form .drawer-b{padding:14px}.fd-ic{width:40px;height:40px}}

/* Applicant-panel stepper (shared) */
.ad-steps{list-style:none;margin:0;padding:0 0 16px;display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));position:relative}
.ad-steps li{position:relative;text-align:center}
.ad-steps li::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.ad-steps li:first-child::before{display:none}
.ad-steps li.done::before,.ad-steps li.cur::before{background:var(--brand)}
.ad-steps button,.ad-steps .st{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;position:relative;z-index:1;padding:0;color:var(--ink-3)}
.ad-steps i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:var(--surface);border:2px solid var(--line-strong);color:var(--ink-3)}
.ad-steps li.done i{background:var(--brand);border-color:var(--brand);color:#fff}
.ad-steps li.cur i{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 5px var(--brand-soft);animation:adPulse 2s infinite}
@keyframes adPulse{50%{box-shadow:0 0 0 8px transparent}}
.ad-steps span{font-size:11.5px;font-weight:700;line-height:1.2}
.ad-steps li.cur span,.ad-steps li.done span{color:var(--ink)}
.ad-steps small{font-size:10.5px;min-height:13px}

.drawer.form .drawer-h{flex-wrap:wrap}

.drawer.form > .steps{display:none}
@media (max-width:600px){.fd-steps span{font-size:10px}.fd-steps small{display:none}}

/* Stages & year groups */
.stg-top{display:flex;gap:16px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.stg-sum{font-size:13px;color:var(--ink-2);text-align:right}
.stg-sum b{font:600 22px var(--f-head);color:var(--ink);display:block;letter-spacing:-.02em}
.stg-ladder{display:flex;gap:4px;height:58px;border-radius:12px;overflow:hidden}
.stg-ladder div{flex:var(--w) 1 0;min-width:0;background:color-mix(in srgb,var(--sc) 22%,var(--surface));border-top:4px solid var(--sc);padding:7px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px}
.stg-ladder b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-ladder small{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg-list{display:flex;flex-direction:column;gap:12px}
.stg{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden}
.stg.off{opacity:.55}
.stg-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--sc) 9%,transparent);flex-wrap:wrap}
.stg-dot{width:12px;height:12px;border-radius:4px;background:var(--sc);flex:none}
.stg-name{height:34px;font-weight:700;flex:1;min-width:150px;background:var(--surface)!important}
.stg-ages{width:86px;height:34px;background:var(--surface)!important}
.stg-tools{display:flex;gap:4px;align-items:center;margin-left:auto}
.stg-tools .iconbtn{width:30px;height:30px;border-radius:8px}
.stg-years{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.ychip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;border-radius:20px;background:var(--surface);border:1px solid var(--line-strong);font-size:13px;font-weight:600}
.ychip button{width:20px;height:20px;border-radius:50%;border:0;background:transparent;color:var(--ink-3);display:grid;place-items:center;padding:0}
.ychip button:hover{background:var(--bad-soft);color:var(--bad)}
.ychip-add{width:150px;height:30px;border-radius:20px!important;border-style:dashed!important;font-size:13px}
.stg-f{display:flex;align-items:center;gap:12px;padding:0 12px 12px;font-size:13px;flex-wrap:wrap}
.stg-f input{width:64px;height:30px}

/* Curricula */
.cur-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.cur-card{padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left}
.cur-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.cur-card:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.cur-card h3{font:600 18px/1.25 var(--f-head);margin:0;letter-spacing:-.02em}
.cur-card p{margin:0;color:var(--ink-3);font-size:13px}
.cur-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.cur-meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.cur-add{border:1.5px dashed var(--line-strong);background:transparent;align-items:center;justify-content:center;color:var(--ink-3);min-height:200px;box-shadow:none}
.cur-add b{color:var(--ink)}
.cur-banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;flex-wrap:wrap}

.cur-from{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--brand-soft);font-size:13px}
.qual{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 34px;gap:8px;align-items:center}

/* ---------- Charts ---------- */
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / p / 2) * p * 2; }
function barChart({labels, series, stacked=false, h=240, fmt=v=>v, max}) {
  const W = 640, L = 52, R = 8, T = 10, B = 26, ih = h - T - B, iw = W - L - R;
  const totals = labels.map((_, i) => stacked ? series.reduce((a, s) => a + s.data[i], 0) : Math.max(...series.map(s => s.data[i])));
  const M = max || niceMax(Math.max(...totals)); const y = v => T + ih - v / M * ih; const bw = iw / labels.length;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = M * k / 4, yy = y(v); g += `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${fmt(v)}</text>`; }
  labels.forEach((lab, i) => {
    const x0 = L + i * bw; g += `<text x="${x0 + bw/2}" y="${h-8}" text-anchor="middle">${lab}</text>`;
    const tip = `<b>${lab}</b><br>` + series.map(s => `${s.name}: ${fmt(s.data[i], true)}`).join('<br>');
    if (stacked) {
      let acc = 0; const w = Math.min(28, bw * .5), x = x0 + (bw - w) / 2;
      series.forEach((s, si) => { const v = s.data[i]; if (!v) return; const y1 = y(acc + v), y0 = y(acc); const top = si === series.length - 1;
        g += top ? `<path d="M${x},${y0} V${y1+4} q0,-4 4,-4 H${x+w-4} q4,0 4,4 V${y0} Z" fill="${s.color}"/>` : `<rect x="${x}" y="${y1}" width="${w}" height="${Math.max(0, y0-y1-2)}" fill="${s.color}"/>`; acc += v; });
    } else {
      const n = series.length, w = Math.min(16, bw * .7 / n), gap = 2, gw = n * w + (n - 1) * gap, xs = x0 + (bw - gw) / 2;
      series.forEach((s, si) => { const v = s.data[i], x = xs + si * (w + gap), yy = y(v), y0 = y(0); const r = Math.min(4, (y0 - yy) / 2);
        g += `<path d="M${x},${y0} V${yy+r} q0,-${r} ${r},-${r} H${x+w-r} q${r},0 ${r},${r} V${y0} Z" fill="${s.color}"/>`; });
    }
    g += `<rect class="hit" x="${x0}" y="${T}" width="${bw}" height="${ih}" data-tip="${tip.replace(/"/g,'&quot;')}"/>`;
  });
  g += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}
function lineChart({labels, data, h=200, min=80, max=100, color='var(--c1)', fmt=v=>v+'%', target}) {
  const W = 640, L = 40, R = 12, T = 12, B = 26, ih = h - T - B, iw = W - L - R;
  const x = i => L + i * iw / (labels.length - 1), y = v => T + ih - (v - min) / (max - min) * ih;
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = min + (max - min) * k / 4; g += `<line class="grid-l" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}%</text>`; }
  if (target) g += `<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink-3)" stroke-dasharray="4 4"/><text x="${L+6}" y="${y(target)-6}">Target ${target}%</text>`;
  const pts = data.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  g += `<polygon points="${L},${y(min)} ${pts} ${x(data.length-1)},${y(min)}" fill="${color}" fill-opacity=".10"/>`;
  g += `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>`;
  const li = data.length - 1; g += `<circle cx="${x(li)}" cy="${y(data[li])}" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2"/><text x="${x(li)-8}" y="${y(data[li])-10}" text-anchor="end" style="font-weight:700;fill:var(--ink)">${fmt(data[li])}</text>`;
  labels.forEach((lab, i) => { if (i % Math.ceil(labels.length / 8) === 0 || i === li) g += `<text x="${x(i)}" y="${h-8}" text-anchor="middle">${lab}</text>`; });
  const step = iw / (labels.length - 1);
  data.forEach((v, i) => g += `<rect class="hit" x="${x(i)-step/2}" y="${T}" width="${step}" height="${ih}" data-tip="<b>${labels[i]}</b><br>Attendance ${fmt(v)}"/>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${h}" role="img">${g}</svg>`;
}

    ctx.mods.forEach(([m]) => { if (!UK.draft.perms[m]) UK.draft.perms[m] = [0,0,0,0,0]; });
